datastax-java-driver {
  basic {
    contact-points = [
      "node-0.gce-us-west-1.0006ab8f55853443c0fc.clusters.scylla.cloud:19042",
      "node-1.gce-us-west-1.0006ab8f55853443c0fc.clusters.scylla.cloud:19042",
      "node-2.gce-us-west-1.0006ab8f55853443c0fc.clusters.scylla.cloud:19042"
    ]

    load-balancing-policy {
      local-datacenter = GCE_US_WEST_1
      local-rack = us-west1-a          # run_it.bash rewrites this for each AZ
      slow-replica-avoidance = false   # keep requests in local-rack even if a replica there is slower
    }

    request.timeout = 30 seconds
  }

  advanced {
    auth-provider {
      class = PlainTextAuthProvider
      # from the environment, e.g. . cluster-<id>.env (sc_api/gen_cluster_env.bash)
      username = scylla
      username = ${?USERNAME}
      password = ${?PASSWORD}
    }

    connection {
      connect-timeout = 15 seconds
      pool.local.size = 4
    }

    control-connection.schema-agreement.timeout = 30 seconds
  }
}
